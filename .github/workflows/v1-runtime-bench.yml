name: v1-runtime-bench

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run v1 runtime benchmark
        env:
          CIELO_RUNTIME_BENCH_WARMUP_RUNS: "5"
          CIELO_RUNTIME_BENCH_MEASURE_RUNS: "25"
        run: |
          cargo bench --bench v1_runtime | tee bench_v1_runtime_output.txt

      - name: Build runtime metrics table
        run: |
          awk -F= '
            /^case=/ { cur_case=$2; if (!(cur_case in seen)) { order[++count]=cur_case; seen[cur_case]=1 } }
            /^warmup_runs=/ { warmup[cur_case]=$2 }
            /^runs=/ { runs[cur_case]=$2 }
            /^total_ms=/ { total[cur_case]=$2 }
            /^per_run_ms=/ { per[cur_case]=$2 }
            END {
              print "case\twarmup_runs\truns\ttotal_ms\tper_run_ms";
              for (i = 1; i <= count; i++) {
                c = order[i];
                printf "%s\t%s\t%s\t%s\t%s\n", c, warmup[c], runs[c], total[c], per[c];
              }
            }
          ' bench_v1_runtime_output.txt > bench_v1_runtime_metrics.tsv

          awk '
            /^relative_to_pure=/ {
              split($0, kv, "=");
              split(kv[2], parts, " ");
              printf "%s\t%s\n", parts[1], parts[2];
            }
          ' bench_v1_runtime_output.txt > bench_v1_runtime_relative.tsv

      - name: Publish runtime benchmark summary
        run: |
          {
            echo "## v1_runtime Benchmark"
            echo ""
            echo "| Case | Warmup runs | Runs | Total ms | Per-run ms | Relative to pure |"
            echo "| --- | ---: | ---: | ---: | ---: | ---: |"
            while IFS=$'\t' read -r case warmup runs total per; do
              [ "$case" = "case" ] && continue
              rel=$(awk -F'\t' -v c="$case" '$1==c {print $2}' bench_v1_runtime_relative.tsv)
              [ -z "$rel" ] && rel="n/a"
              echo "| \`$case\` | $warmup | $runs | $total | $per | $rel |"
            done < bench_v1_runtime_metrics.tsv
            echo ""
            echo "<details><summary>Raw output</summary>"
            echo ""
            echo '```text'
            cat bench_v1_runtime_output.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload runtime benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v1-runtime-benchmark
          path: |
            bench_v1_runtime_output.txt
            bench_v1_runtime_metrics.tsv
            bench_v1_runtime_relative.tsv
